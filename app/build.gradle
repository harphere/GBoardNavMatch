plugins { id 'com.android.application' }

android {
    namespace 'dev.chet.gboardnavmatch'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.chet.gboardnavmatch'
        minSdk 31
        targetSdk 36
        versionCode 10001
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint { abortOnError true }
}

dependencies {
    compileOnly files('libs/xposed-api-82-stub.jar')
}
