name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes the Android SDK and command-line
      # tools. Do NOT use android-actions/setup-android here: current cmdline-tools
      # reject the obsolete SDK package named "tools" that that action may request.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GboardNavMatch-v1.0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
